[project]
name = "parking-predict"
version = "0.1.0"
description = "Real-time on-street parking occupancy and arrival-time availability prediction (Melbourne)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "polars>=1.17",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "tenacity>=9.0",
    # Windows ships no IANA timezone database and polars needs one for
    # timezone-aware timestamps. Without this, any operation on a UTC datetime
    # fails with ZoneInfoNotFoundError.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "h3>=4.1",
    "matplotlib>=3.9",
]
# DuckDB is kept separate because its binary is blocked by the development
# machine's Application Control policy (see the README). It works inside the
# Linux container; polars covers the queries meanwhile, so it is not a core
# dependency.
sql = [
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parking"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # prefer pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/parking"]
