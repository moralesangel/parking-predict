# Levanta la captura de datos y el mapa:
#
#   docker compose up --build
#   -> http://localhost:8000
#
# La API y el frontend van en el mismo servicio: FastAPI monta `web/` como
# estáticos. Separarlos obligaría a un nginx con proxy inverso -y su
# configuración, y CORS- para que el navegador pudiera llamar a la API desde
# otro origen. Para un único HTML estático no compensa.
services:
  poller:
    build: .
    image: parking-predict/poller
    command: ["python", "-m", "parking.ingest.poller"]
    restart: unless-stopped
    environment:
      # El contenedor escribe en /data, que se monta desde ./data del host.
      PARKING_DATA_DIR: /data
      PARKING_POLL_INTERVAL_SECONDS: ${PARKING_POLL_INTERVAL_SECONDS:-120}
      PARKING_API_BASE_URL: ${PARKING_API_BASE_URL:-https://data.melbourne.vic.gov.au}
      PARKING_REALTIME_DATASET: ${PARKING_REALTIME_DATASET:-on-street-parking-bay-sensors}
    volumes:
      - ./data:/data
    # El UID coincide con el usuario `parking` del Dockerfile para que los
    # ficheros del volumen no queden propiedad de root en el host.
    user: "10001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: .
    image: parking-predict/poller
    command:
      ["python", "-m", "uvicorn", "--factory", "parking.api.app:create_app",
       "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "${PARKING_API_PORT:-8000}:8000"
    environment:
      PARKING_DATA_DIR: /data
      PARKING_STUCK_AFTER_HOURS: ${PARKING_STUCK_AFTER_HOURS:-24}
      # /predict necesita, dentro de ./data: processed/models/ (de
      # train_evaluate.py) y reference/parking_bays.json (de
      # fetch_reference.py). Sin ellos el endpoint responde 503 con el
      # mensaje de que falta; el resto de la API sigue funcionando.
    volumes:
      # Solo lectura: la API nunca escribe datos, solo sirve lo que el poller
      # dejó. Montarlo `ro` convierte esa intención en una garantía.
      - ./data:/data:ro
    user: "10001"
    depends_on:
      # El poller tarda unos segundos en escribir el primer snapshot. Hasta
      # entonces la API responde 503 con un mensaje claro, no un error opaco.
      - poller
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys,json; \
              r=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=5)); \
              sys.exit(0 if r['status']=='ok' else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
