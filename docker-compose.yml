# Brings up data capture and the map:
#
#   docker compose up --build
#   -> http://localhost:8000
#
# The API and the frontend live in the same service: FastAPI mounts `web/` as
# static files. Splitting them would require an nginx reverse proxy - and its
# configuration, and CORS - so the browser could call the API from another
# origin. For a single static HTML page that is not worth it.
services:
  poller:
    build: .
    image: parking-predict/poller
    command: ["python", "-m", "parking.ingest.poller"]
    restart: unless-stopped
    environment:
      # The container writes to /data, mounted from ./data on the host.
      PARKING_DATA_DIR: /data
      PARKING_POLL_INTERVAL_SECONDS: ${PARKING_POLL_INTERVAL_SECONDS:-120}
      PARKING_API_BASE_URL: ${PARKING_API_BASE_URL:-https://data.melbourne.vic.gov.au}
      PARKING_REALTIME_DATASET: ${PARKING_REALTIME_DATASET:-on-street-parking-bay-sensors}
    volumes:
      - ./data:/data
    # The UID matches the `parking` user in the Dockerfile so the volume's
    # files do not end up owned by root on the host.
    user: "10001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Periodic job: refreshes the monitoring report and attempts a retrain.
  # A `sleep` loop rather than cron: the container is single-process and adding
  # a cron daemon just for this would complicate the logs and the shutdown
  # signal. If the job grows, move it to a real scheduler.
  operations:
    build: .
    image: parking-predict/poller
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          python scripts/monitor.py || echo "monitor failed";
          python scripts/retrain.py --horizon 15 || echo "retrain failed";
          sleep "${PARKING_OPERATIONS_INTERVAL_SECONDS:-86400}";
        done
    environment:
      PARKING_DATA_DIR: /data
      PARKING_STUCK_AFTER_HOURS: ${PARKING_STUCK_AFTER_HOURS:-24}
    volumes:
      - ./data:/data
    user: "10001"
    depends_on:
      - poller
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: .
    image: parking-predict/poller
    command:
      ["python", "-m", "uvicorn", "--factory", "parking.api.app:create_app",
       "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "${PARKING_API_PORT:-8000}:8000"
    environment:
      PARKING_DATA_DIR: /data
      PARKING_STUCK_AFTER_HOURS: ${PARKING_STUCK_AFTER_HOURS:-24}
      # /predict needs, inside ./data: processed/models/ (from
      # train_evaluate.py) and reference/parking_bays.json (from
      # fetch_reference.py). Without them the endpoint answers 503 saying what
      # is missing; the rest of the API keeps working.
    volumes:
      # Read-only: the API never writes data, it only serves what the poller
      # left behind. Mounting it `ro` turns that intent into a guarantee.
      - ./data:/data:ro
    user: "10001"
    depends_on:
      # The poller takes a few seconds to write the first snapshot. Until
      # then the API answers 503 with a clear message, not an opaque error.
      - poller
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys,json; \
              r=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=5)); \
              sys.exit(0 if r['status']=='ok' else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
